{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "travel.labels" . | nindent 4 }}
  annotations:
    # same limit as the app's MAX_CONTENT_LENGTH, for JSON imports
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # The longest matching prefix wins, so /api goes to the backend
          # and everything else falls through to the frontend.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  name: http
{{- end }}
