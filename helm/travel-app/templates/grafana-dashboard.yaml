{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "travel.labels" . | nindent 4 }}
    grafana_dashboard: "1"     # Grafana's sidecar loads ConfigMaps with this label
data:
  travel.json: |-
{{ .Files.Get "dashboards/travel.json" | indent 4 }}
{{- end }}
