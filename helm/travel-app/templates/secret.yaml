{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "travel.secretName" . }}
  labels:
    {{- include "travel.labels" . | nindent 4 }}
type: Opaque
# stringData: plain text here, Kubernetes stores it base64-encoded.
# (base64 is encoding, NOT encryption - that's why the values come from a
# git-ignored file, and why Vault is the "real" answer in production.)
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  SECRET_KEY: {{ required "secrets.secretKey is required" .Values.secrets.secretKey | quote }}
{{- end }}
