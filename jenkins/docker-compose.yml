name: jenkins
services:
  jenkins:
    build: .
    image: travel-jenkins:local
    ports:
      - "8090:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["0"]
    # default = talk to SonarQube by name; minikube = reach the cluster API
    networks: [default, minikube]
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"            # SonarQube UI
    volumes:
      - sonar-data:/opt/sonarqube/data              # analysis results (embedded DB)
      - sonar-extensions:/opt/sonarqube/extensions  # plugins
    restart: unless-stopped

volumes:
  jenkins-home:
  sonar-data:
  sonar-extensions:

networks:
  minikube:
    external: true
